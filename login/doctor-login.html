<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Login - Family MED</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #0d6efd;
            --secondary: #0dcaf0;
            --success: #198754;
        }
        
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .login-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            max-width: 450px;
            width: 100%;
        }
        
        .login-header {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            padding: 40px 30px;
            text-align: center;
        }
        
        .login-header h2 {
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 10px;
        }
        
        .login-header p {
            opacity: 0.9;
            font-size: 14px;
        }
        
        .login-body {
            padding: 40px 30px;
        }
        
        .form-group {
            margin-bottom: 25px;
        }
        
        .form-label {
            font-weight: 500;
            color: #333;
            margin-bottom: 8px;
            display: block;
        }
        
        .form-control {
            width: 100%;
            padding: 14px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 16px;
            transition: all 0.3s;
        }
        
        .form-control:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(13, 110, 253, 0.1);
            outline: none;
        }
        
        .btn-login {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(13, 110, 253, 0.3);
        }
        
        .login-options {
            text-align: center;
            margin-top: 25px;
            padding-top: 25px;
            border-top: 1px solid #eee;
        }
        
        .login-options a {
            color: var(--primary);
            text-decoration: none;
            font-size: 14px;
            transition: color 0.3s;
        }
        
        .login-options a:hover {
            color: var(--secondary);
            text-decoration: underline;
        }
        
        @media (max-width: 768px) {
            .login-container {
                margin: 20px;
            }
            
            .login-body {
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h2><i class="fas fa-user-md me-2"></i>Family MED</h2>
            <p>Doctor Portal Login</p>
        </div>
        
        <div class="login-body">
            <form id="doctorLoginForm">
                <div class="form-group">
                    <label class="form-label">Doctor ID / Email</label>
                    <input type="text" id="doctorEmail" class="form-control" placeholder="Enter your ID or email" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" id="doctorPassword" class="form-control" placeholder="Enter your password" required>
                </div>
                
                <div class="form-group form-check">
                    <input type="checkbox" class="form-check-input" id="rememberMe">
                    <label class="form-check-label" for="rememberMe">Remember me</label>
                </div>
                
                <button type="submit" class="btn-login">
                    <i class="fas fa-sign-in-alt"></i> Login to Doctor Portal
                </button>
            </form>
            
            <div class="login-options">
                <a href="#" onclick="showForgotPassword()">Forgot Password?</a>
                <span class="mx-2">|</span>
                <a href="../index.html">Back to Home</a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        // Sample doctor data
        const sampleDoctors = [
            {
                id: 1,
                doctorId: "DOC001",
                name: "Dr. Sarah Johnson",
                email: "doctor@familymed.com",
                password: "doctor123",
                specialization: "Cardiologist",
                phone: "+1234567890",
                status: "active"
            },
            {
                id: 2,
                doctorId: "DOC002",
                name: "Dr. Michael Chen",
                email: "test@doctor.com",
                password: "test123",
                specialization: "Neurologist",
                phone: "+998901234567",
                status: "active"
            }
        ];

        document.getElementById('doctorLoginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const email = document.getElementById('doctorEmail').value.trim();
            const password = document.getElementById('doctorPassword').value;
            const rememberMe = document.getElementById('rememberMe').checked;
            
            const loginBtn = document.querySelector('.btn-login');
            const originalText = loginBtn.innerHTML;
            loginBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Logging in...';
            loginBtn.disabled = true;
            
            // Simulate API call
            setTimeout(() => {
                const doctor = sampleDoctors.find(d => 
                    (d.email === email || d.doctorId === email) && d.password === password
                );
                
                if (doctor) {
                    // Store doctor data in localStorage
                    localStorage.setItem('currentDoctor', JSON.stringify(doctor));
                    if (rememberMe) {
                        localStorage.setItem('rememberedDoctor', email);
                    }
                    
                    // Redirect to dashboard
                    window.location.href = 'doctor-dashboard.html';
                    
                } else {
                    alert('Invalid credentials. Please try again.');
                    loginBtn.innerHTML = originalText;
                    loginBtn.disabled = false;
                }
            }, 1500);
        });
        
        function showForgotPassword() {
            const email = prompt('Please enter your doctor email to reset password:');
            if (email) {
                alert(`Password reset link has been sent to ${email}\n\n(In real application, this would send an email)`);
            }
        }
        
        // Check for remembered doctor
        window.addEventListener('DOMContentLoaded', function() {
            const rememberedDoctor = localStorage.getItem('rememberedDoctor');
            if (rememberedDoctor) {
                document.getElementById('doctorEmail').value = rememberedDoctor;
                document.getElementById('rememberMe').checked = true;
            }
        });
    </script>
</body>
</html>
